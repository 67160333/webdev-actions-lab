name: Deploy Static Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      # Challenge: ตรวจสอบไฟล์ก่อน Deploy ถ้าไม่พบ Job จะ Failed และไม่ Deploy
      - name: Check required files
        run: |
          test -f index.html || { echo "::error::index.html not found"; exit 1; }
          test -f style.css  || { echo "::error::style.css not found"; exit 1; }
          test -f script.js  || { echo "::error::script.js not found"; exit 1; }
          echo "All required files found"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
